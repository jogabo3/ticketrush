services:
  postgres:
    image: postgres:17
    container_name: ticketrush-postgres
    environment:
      POSTGRES_USER: ticketrush
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: ticketrush
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketrush -d ticketrush"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: